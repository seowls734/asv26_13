<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>행성 합치기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 레이아웃: 한 화면 고정 앱 — 상단(최고/큰 점수/다음) · 미션 바 · 우주 상자 · 행성 순서 */
:root{
  --space:#161d45;
  --space-2:#3a4680;
  --panel:#2a3366;
  --edge:#c9c2ff;
  --text:#ffffff;
  --pop:#ffd84d;
  --pink:#ff9cc8;
  --font-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(ellipse at 50% 0%,var(--space-2) 0%,var(--space) 70%);
  color:var(--text);
  font-family:var(--font-display);
  overflow:hidden;
  user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.app{
  height:100%;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px;box-sizing:border-box;
}
.outline{-webkit-text-stroke:6px var(--space);paint-order:stroke fill}
.top{width:100%;max-width:420px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.best{justify-self:start;font-size:15px;display:flex;align-items:center;gap:4px}
.best b{font-weight:400;color:var(--pop);font-variant-numeric:tabular-nums}
.score{font-size:46px;line-height:1;font-variant-numeric:tabular-nums;transition:transform .12s}
.score.bump{transform:scale(1.18)}
.right{justify-self:end;display:flex;align-items:center;gap:8px}
.bubble{
  width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.14);
  border:2px solid var(--edge);display:grid;place-items:center;position:relative
}
.bubble small{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:11px;background:var(--panel);padding:0 6px;border-radius:8px;white-space:nowrap}
.sound{
  width:36px;height:36px;border-radius:50%;border:2px solid var(--edge);background:transparent;
  color:var(--text);font-family:var(--font-display);font-size:18px;padding:0;box-shadow:none;cursor:pointer
}
.sound[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.mission{
  display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);
  border:2px solid rgba(201,194,255,.5);border-radius:999px;padding:3px 14px 3px 6px;font-size:16px
}
.mission .tag{background:var(--pink);color:var(--space);border-radius:999px;padding:1px 9px;font-size:13px}
.stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
canvas#cv{display:block;touch-action:none;border-radius:26px;box-shadow:0 0 0 3px var(--edge),0 10px 0 rgba(0,0,0,.25),0 0 40px rgba(255,156,200,.3)}
.chain{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px;max-width:420px}
.over{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,12,35,.6);z-index:20}
.card{
  background:linear-gradient(180deg,#3d4893,#2a3366);border:4px solid var(--edge);border-radius:32px;
  padding:26px 30px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;max-width:82vw;
  animation:popin .45s cubic-bezier(.2,1.6,.4,1)
}
@keyframes popin{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{margin:0;font-weight:400;font-size:30px}
.card .big{font-size:58px;font-variant-numeric:tabular-nums;color:var(--pop)}
.card .msg{font-size:17px;min-height:1.2em}
.card .stats{font-size:14px;opacity:.8}
button.go{
  margin-top:8px;font-family:var(--font-display);font-size:24px;color:var(--space);background:var(--pop);
  border:none;border-radius:999px;padding:12px 34px;box-shadow:0 5px 0 #c99a12;cursor:pointer
}
button.go:active{transform:translateY(4px);box-shadow:0 1px 0 #c99a12}
button:focus-visible{outline:3px solid var(--text);outline-offset:3px}
button.ghost{
  font-family:var(--font-display);font-size:20px;color:var(--text);background:transparent;
  border:2px solid var(--edge);border-radius:999px;padding:9px 28px;cursor:pointer;min-width:160px
}
button.ghost:active{transform:translateY(2px)}
.card button.go{min-width:160px}
.confirm{z-index:25}
.confirm .row{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;justify-content:center}
.confirm .row button{min-width:110px;margin-top:0}
button.go.danger{background:var(--pink);box-shadow:0 5px 0 #c9618f}
button.go.danger:active{box-shadow:0 1px 0 #c9618f}
#menuBtn{font-size:15px;letter-spacing:1px}
/* 시작(로딩) 화면 */
.intro{
  position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  background:radial-gradient(ellipse at 50% 30%,#4a5596 0%,var(--space) 75%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));
  transition:opacity .45s,transform .45s;
}
.intro.out{opacity:0;transform:scale(1.08);pointer-events:none}
.intro{overflow:hidden}
#introBg{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.intro > *:not(#introBg){position:relative;z-index:1}
.intro h1{margin:0;font-weight:400;font-size:clamp(46px,14vw,66px);color:var(--pop);line-height:1.05;animation:float 3s ease-in-out infinite}
.intro .sub{font-size:18px;margin:0}
.intro canvas{max-width:100%}
.loadwrap{width:220px;display:flex;flex-direction:column;gap:6px;align-items:center;font-size:14px;opacity:.85}
.bar{width:100%;height:14px;border-radius:999px;background:rgba(255,255,255,.15);border:2px solid var(--edge);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--pop));border-radius:999px}
.intro .go{animation:pulse 1.2s ease-in-out infinite;margin-top:0}
.intro .tip{font-size:13px;opacity:.7;margin:0}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){.card,.intro h1,.intro .go{animation:none}.score{transition:none}}
</style>

<div class="app">
  <div class="top">
    <div class="best outline">최고 <b id="best">0</b></div>
    <div class="score outline" id="score">0</div>
    <div class="right">
      <div class="bubble"><small>다음</small><canvas id="nextCv"></canvas></div>
      <button class="sound" id="sound" type="button" aria-pressed="true" aria-label="소리 켜기/끄기">♪</button>
      <button class="sound" id="menuBtn" type="button" aria-label="메뉴 (잠깐 멈춤)">II</button>
    </div>
  </div>
  <div class="stage" id="stage"><canvas id="cv"></canvas></div>
  <div class="chain" id="chain"></div>
</div>

<div class="over" id="over" hidden>
  <div class="card">
    <canvas id="overCv"></canvas>
    <h2>우주가 꽉 찼어요!</h2>
    <div class="big outline" id="finalScore">0</div>
    <div class="msg" id="finalMsg"></div>
    <div class="stats" id="finalStats"></div>
    <button class="go" id="restart" type="button">다시 하기</button>
    <button class="ghost" id="overExit" type="button">처음 화면으로</button>
  </div>
</div>

<div class="over" id="menu" hidden>
  <div class="card">
    <h2>잠깐 멈춤</h2>
    <div class="msg">지금 점수 <b id="menuScore">0</b></div>
    <button class="go" id="resume" type="button">계속하기</button>
    <button class="ghost" id="menuRestart" type="button">다시 시작</button>
    <button class="ghost" id="menuExit" type="button">나가기</button>
  </div>
</div>

<div class="over confirm" id="confirm" hidden>
  <div class="card">
    <h2 id="confirmTitle">정말 다시 시작할까요?</h2>
    <div class="msg" id="confirmMsg">지금 만든 행성과 점수가 사라져요</div>
    <div class="row">
      <button class="ghost" id="confirmNo" type="button">아니요</button>
      <button class="go danger" id="confirmYes" type="button">네</button>
    </div>
  </div>
</div>

<div class="intro" id="intro">
  <canvas id="introBg" aria-hidden="true"></canvas>
  <h1 class="outline">행성<br>합치기</h1>
  <canvas id="introCv"></canvas>
  <div class="loadwrap" id="introLoad">
    <div class="bar"><i id="introBar"></i></div>
    <span id="introMsg">우주로 출발하는 중...</span>
  </div>
  <button class="go" id="introGo" type="button" hidden>시작하기</button>
  <p class="tip">소리를 켜면 더 재밌어요</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
const { Engine, Bodies, Body, Composite, Events } = Matter;
const PI2 = Math.PI*2;

// ===== 설정 =====
const W = 400, H = 600;
const WALL = 10;
const DROP_Y = 72;
const DANGER_Y = 122;
const OVER_TIME = 1600;
const DROP_COOLDOWN = 420;
const MAX_START = 4;
const SAD_AFTER = 7;             // 이만큼 떨어뜨리는 동안 못 합쳐지면 시무룩
const CRY_AFTER = 12;            // 이만큼 지나면 눈물 뚝뚝
// 로켓 (위 가운데에 떠 있음, 코끝이 겨누는 쪽을 봄)
const CANNON_X = 200, CANNON_Y = 50;   // 회전 중심 (위쪽에 꼬리 불꽃 자리를 남김)
const ROCKET_NOSE = 34;                // 회전 중심 ~ 코끝 거리
const ROCKET_TAIL = 24;                // 회전 중심 ~ 꼬리(불꽃 나오는 곳) 거리
const AIM_MAX = 65 * Math.PI/180;      // 바로 아래에서 좌우 최대 65도
const SHOOT_SPEED = 5.5;               // 발사 속도 (MAXV 9보다 한참 느리게)

// 실제 크기 순서: 운석 < 달 < 수성 < 화성 < 금성 < 지구 < 해왕성 < 천왕성 < 토성 < 목성 < 태양
const PLANETS = [
  { name:'운석',   r:17, c:'#b3a69b', craters:true },
  { name:'달',     r:23, c:'#ebe6dc', craters:true },
  { name:'수성',   r:30, c:'#c9b8a8', craters:true },
  { name:'화성',   r:37, c:'#f28d6b', craters:true },
  { name:'금성',   r:45, c:'#f7d48e', bands:['#e8b863'] },
  { name:'지구',   r:53, c:'#5aa8f2', earth:true },
  { name:'해왕성', r:61, c:'#6f8cf5', bands:['#5470dc'] },
  { name:'천왕성', r:70, c:'#9de9eb', bands:['#7fd6da'] },
  { name:'토성',   r:79, c:'#f4d7a0', bands:['#ddb878','#fbe7bf'], ring:true },
  { name:'목성',   r:88, c:'#ecbd90', bands:['#c98f5f','#f7dcb8','#b97b52'], spot:true },
  { name:'태양',   r:98, c:'#ffd84d', sun:true },
];
const MISSIONS = [5, 7, 8, 9, 10];   // 지구 → 천왕성 → 토성 → 목성 → 태양

// ===== 색 도우미 =====
function rgb(h){ const n = parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mix(h, t, k){ const a = rgb(h), b = rgb(t); return `rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*k)).join(',')})`; }

// ===== 얼굴 =====
function drawFace(g, r, mood, blink, now = 0){
  const ink = '#2b2147';
  const ex = r*0.3, ey = -r*0.02;
  g.fillStyle = ink; g.strokeStyle = ink; g.lineCap = 'round';
  if (r < 10){   // 아주 작을 땐 점 두 개
    g.beginPath(); g.arc(-ex, ey, Math.max(1, r*0.12), 0, PI2); g.arc(ex, ey, Math.max(1, r*0.12), 0, PI2); g.fill();
    return;
  }
  const er = r*0.12;
  const sad = mood === 'sad' || mood === 'cry';
  if (sad){
    // 축 처진 눈썹 (안쪽이 올라감)
    g.lineWidth = Math.max(1.4, r*0.045);
    for (const s of [-1,1]){
      g.beginPath();
      g.moveTo(s*(ex + er*1.1), ey - er*1.5);
      g.lineTo(s*(ex - er*0.9), ey - er*2.3);
      g.stroke();
    }
  }
  if (mood === 'cry'){
    // 꾹 감은 눈 + 흐르는 눈물
    g.lineWidth = Math.max(1.6, r*0.06);
    for (const s of [-1,1]){ g.beginPath(); g.arc(s*ex, ey - er*0.3, er*0.85, Math.PI*0.15, Math.PI*0.85); g.stroke(); }
    for (const s of [-1,1]){
      const ph = ((now/700) + (s > 0 ? 0.5 : 0)) % 1;
      const ty = ey + er*0.8 + ph*r*0.5, tr = Math.max(1.5, r*0.07);
      g.globalAlpha *= 1 - ph*0.7;
      g.fillStyle = '#7cc8ff';
      g.beginPath(); g.arc(s*(ex + er*0.3), ty, tr, 0, Math.PI);
      g.lineTo(s*(ex + er*0.3), ty - tr*2.2); g.closePath(); g.fill();
      g.globalAlpha /= 1 - ph*0.7;
    }
    g.fillStyle = ink;
  } else if (mood === 'happy'){
    g.lineWidth = Math.max(1.6, r*0.07);
    for (const s of [-1,1]){ g.beginPath(); g.arc(s*ex, ey+er*0.5, er*0.85, Math.PI*1.15, Math.PI*1.85); g.stroke(); }
  } else if (blink){
    g.lineWidth = Math.max(1.4, r*0.05);
    for (const s of [-1,1]){ g.beginPath(); g.moveTo(s*ex-er*0.8, ey); g.lineTo(s*ex+er*0.8, ey); g.stroke(); }
  } else {
    for (const s of [-1,1]){
      g.fillStyle = ink; g.beginPath(); g.ellipse(s*ex, ey, er, er*1.15, 0, 0, PI2); g.fill();
      g.fillStyle = '#fff';
      g.beginPath(); g.arc(s*ex - er*0.35, ey - er*0.4, er*0.38, 0, PI2); g.fill();
      g.beginPath(); g.arc(s*ex + er*0.35, ey + er*0.35, er*0.16, 0, PI2); g.fill();
    }
  }
  g.fillStyle = 'rgba(255,110,150,.45)';
  for (const s of [-1,1]){ g.beginPath(); g.ellipse(s*r*0.5, ey + r*0.2, r*0.12, r*0.07, 0, 0, PI2); g.fill(); }
  g.fillStyle = ink; g.strokeStyle = ink;
  if (mood === 'scared'){
    g.beginPath(); g.ellipse(0, ey + r*0.24, r*0.07, r*0.09, 0, 0, PI2); g.fill();
  } else if (sad){
    g.lineWidth = Math.max(1.4, r*0.05);
    const w = mood === 'cry' ? 0.14 : 0.1;
    g.beginPath(); g.arc(0, ey + r*0.34, r*w, Math.PI*1.2, Math.PI*1.8); g.stroke();
  } else {
    g.lineWidth = Math.max(1.4, r*0.05);
    g.beginPath(); g.arc(0, ey + r*0.13, r*(mood === 'happy' ? 0.13 : 0.09), 0.15*Math.PI, 0.85*Math.PI); g.stroke();
  }
}

// ===== 행성 =====
function drawPlanet(g, lv, x, y, r, o = {}){
  const p = PLANETS[lv];
  const angle = o.angle || 0;
  g.save();
  g.globalAlpha = o.alpha ?? 1;
  g.translate(x, y);
  if (o.sx || o.sy){
    const rr = o.squashRot || 0;
    g.rotate(rr); g.scale(o.sx || 1, o.sy || 1); g.rotate(-rr);
  }

  if (p.sun){
    const glow = g.createRadialGradient(0,0,r*0.7,0,0,r*1.4);
    glow.addColorStop(0,'rgba(255,216,77,.5)'); glow.addColorStop(1,'rgba(255,150,60,0)');
    g.fillStyle = glow; g.beginPath(); g.arc(0,0,r*1.4,0,PI2); g.fill();
  }
  if (p.ring){
    g.save(); g.rotate(-0.3);
    g.strokeStyle = 'rgba(251,231,191,.5)'; g.lineWidth = r*0.13;
    g.beginPath(); g.ellipse(0,0,r*1.42,r*0.36,0,Math.PI,PI2); g.stroke();
    g.restore();
  }

  // 입체 바탕 (빛은 항상 왼쪽 위)
  const base = g.createRadialGradient(-r*0.35,-r*0.4,r*0.05,0,0,r);
  base.addColorStop(0, mix(p.c,'#ffffff',0.5));
  base.addColorStop(0.55, p.c);
  base.addColorStop(1, mix(p.c,'#281a55',0.38));
  g.beginPath(); g.arc(0,0,r,0,PI2);
  g.fillStyle = base; g.fill();

  // 표면 무늬 (굴러갈 때 같이 회전)
  g.save(); g.clip(); g.rotate(angle); g.globalAlpha *= 0.55;
  if (p.bands){
    const n = p.bands.length*2 + 1;
    p.bands.forEach((col, i) => { g.fillStyle = col; g.fillRect(-r, -r + 2*r*((i*2+1)/n), 2*r, 2*r/n*0.8); });
  }
  if (p.spot){ g.fillStyle = '#d2604a'; g.beginPath(); g.ellipse(r*0.35, r*0.45, r*0.18, r*0.1, 0, 0, PI2); g.fill(); }
  if (p.craters){
    g.fillStyle = mix(p.c,'#3a2a50',0.35);
    [[-.5,-.45,.15],[.55,-.15,.12],[-.55,.5,.11],[.5,.55,.09]].forEach(([cx,cy,cr]) => { g.beginPath(); g.arc(cx*r,cy*r,cr*r,0,PI2); g.fill(); });
  }
  if (p.earth){
    g.fillStyle = '#62d07a';
    [[-.55,-.4,.3,.22],[.55,.35,.28,.35],[.15,-.75,.3,.14],[-.5,.62,.25,.16]].forEach(([cx,cy,rx,ry]) => { g.beginPath(); g.ellipse(cx*r,cy*r,rx*r,ry*r,.4,0,PI2); g.fill(); });
  }
  if (p.sun){
    g.fillStyle = '#ffb648';
    [[-.55,-.35,.14],[.55,.4,.12],[.15,-.7,.09],[-.4,.6,.1]].forEach(([cx,cy,cr]) => { g.beginPath(); g.arc(cx*r,cy*r,cr*r,0,PI2); g.fill(); });
  }
  g.restore();

  // 반짝이는 하이라이트 + 테두리
  g.fillStyle = 'rgba(255,255,255,.6)';
  g.beginPath(); g.ellipse(-r*0.4,-r*0.45,r*0.2,r*0.11,-0.7,0,PI2); g.fill();
  g.beginPath(); g.arc(-r*0.12,-r*0.62,r*0.045,0,PI2); g.fill();
  g.lineWidth = Math.max(1.5, r*0.055);
  g.strokeStyle = mix(p.c,'#281a55',0.55);
  g.beginPath(); g.arc(0,0,r,0,PI2); g.stroke();

  if (p.ring){
    g.save(); g.rotate(-0.3);
    g.strokeStyle = 'rgba(251,231,191,.95)'; g.lineWidth = r*0.13;
    g.beginPath(); g.ellipse(0,0,r*1.42,r*0.36,0,0,Math.PI); g.stroke();
    g.restore();
  }
  if (o.face !== false){
    g.save(); g.rotate(angle);   // 얼굴도 같이 데굴데굴
    drawFace(g, r, o.mood, o.blink, o.now);
    g.restore();
  }
  g.restore();
}

function setupMini(c, size){
  const d = window.devicePixelRatio || 1;
  c.width = size*d; c.height = size*d; c.style.width = c.style.height = size + 'px';
  const g = c.getContext('2d'); g.scale(d, d);
  return g;
}

// ===== 화면 =====
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
let scale = 1;
function fit(){
  const dpr = window.devicePixelRatio || 1;
  scale = Math.min(stage.clientWidth / W, stage.clientHeight / H);
  cv.style.width = W*scale + 'px';
  cv.style.height = H*scale + 'px';
  cv.width = W*scale*dpr; cv.height = H*scale*dpr;
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  buildBg(scale*dpr);
}
addEventListener('resize', fit);

// ===== 배경: 파스텔 은하 =====
let bgCanvas = null;
function rnd(a, b){ return a + Math.random()*(b - a); }
function gauss(){ return (Math.random()+Math.random()+Math.random()-1.5)/1.5; }
function drawGalaxy(g, x, y, r, rot, tint){
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(1, 0.38);
  const gr = g.createRadialGradient(0,0,0,0,0,r);
  gr.addColorStop(0,'rgba(255,250,235,.95)'); gr.addColorStop(0.25,tint); gr.addColorStop(1,'rgba(160,170,240,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(0,0,r,0,PI2); g.fill();
  g.lineWidth = r*0.06;
  for (let i = 1; i <= 3; i++){ g.strokeStyle = `rgba(230,225,255,${0.35 - i*0.08})`; g.beginPath(); g.arc(0,0,r*(0.35+i*0.18), i, i+Math.PI*1.3); g.stroke(); }
  g.restore();
}
function buildBg(k){
  bgCanvas = document.createElement('canvas');
  bgCanvas.width = W*k; bgCanvas.height = H*k;
  const g = bgCanvas.getContext('2d'); g.scale(k, k);
  const base = g.createLinearGradient(0,0,W,H);
  base.addColorStop(0,'#1a2150'); base.addColorStop(0.5,'#34427a'); base.addColorStop(1,'#1b2350');
  g.fillStyle = base; g.fillRect(0,0,W,H);
  g.save(); g.translate(W*0.5,H*0.5); g.rotate(-0.55); g.scale(1,0.3);
  const band = g.createRadialGradient(0,0,0,0,0,W*0.95);
  band.addColorStop(0,'rgba(255,244,232,.8)'); band.addColorStop(0.18,'rgba(255,214,222,.45)');
  band.addColorStop(0.45,'rgba(206,176,232,.26)'); band.addColorStop(0.75,'rgba(140,165,230,.13)'); band.addColorStop(1,'rgba(140,165,230,0)');
  g.fillStyle = band; g.beginPath(); g.arc(0,0,W*0.95,0,PI2); g.fill();
  for (let i = 0; i < 9; i++){ g.strokeStyle = i%3===0 ? 'rgba(255,205,170,.26)' : 'rgba(190,200,255,.18)'; g.lineWidth = 2.2; g.beginPath(); g.arc(0,0,W*(0.22+i*0.065),0,PI2); g.stroke(); }
  g.restore();
  const ca = Math.cos(-0.55), sa = Math.sin(-0.55);
  for (let i = 0; i < 220; i++){
    const t = rnd(-W*0.8, W*0.8), off = gauss()*W*0.16;
    g.fillStyle = Math.random() < 0.6 ? `rgba(255,160,205,${rnd(.25,.7)})` : `rgba(255,255,255,${rnd(.3,.8)})`;
    g.beginPath(); g.arc(W*0.5 + t*ca - off*sa, H*0.5 + t*sa + off*ca, rnd(0.4,1.8), 0, PI2); g.fill();
  }
  drawGalaxy(g, W*0.15, H*0.2, 38, -0.6, 'rgba(225,215,255,.55)');
  drawGalaxy(g, W*0.86, H*0.66, 34, 0.3, 'rgba(255,215,235,.55)');
  drawGalaxy(g, W*0.2, H*0.86, 26, -0.2, 'rgba(255,200,230,.5)');
  drawGalaxy(g, W*0.9, H*0.12, 14, 0.8, 'rgba(225,215,255,.5)');
  for (let i = 0; i < 140; i++){ g.fillStyle = `rgba(255,255,255,${rnd(.25,.75)})`; g.fillRect(rnd(0,W), rnd(0,H), 1, 1); }
  // 바닥 쪽을 살짝 밝혀 '그릇' 느낌
  const floor = g.createLinearGradient(0,H*0.75,0,H);
  floor.addColorStop(0,'rgba(255,200,230,0)'); floor.addColorStop(1,'rgba(255,200,230,.16)');
  g.fillStyle = floor; g.fillRect(0,H*0.75,W,H*0.25);
}
const stars = Array.from({length:30}, () => ({ x:Math.random()*W, y:Math.random()*H, s:rnd(1.5,4.2), t:Math.random()*6, pink:Math.random()<0.45, spark:Math.random()<0.5 }));
function drawSparkle(g, x, y, s, color){
  g.fillStyle = color; g.beginPath();
  g.moveTo(x, y-s*2); g.quadraticCurveTo(x,y,x+s*2,y); g.quadraticCurveTo(x,y,x,y+s*2); g.quadraticCurveTo(x,y,x-s*2,y); g.quadraticCurveTo(x,y,x,y-s*2);
  g.fill();
}
function drawStar5(g, x, y, s, color){

  for (let i = 0; i < 10; i++){ const r = i%2 ? s*0.5 : s*1.3, a = -Math.PI/2 + i*Math.PI/5; g.lineTo(x+Math.cos(a)*r, y+Math.sin(a)*r); }
  g.closePath(); g.fill();
}

let actx = null, soundOn = true;
function audioUnlock(){
  if (!actx){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type = 'sine', vol = 0.18, slideTo = 0, delay = 0){
  if (!actx || !soundOn) return;
  const t0 = actx.currentTime + delay;
  const o = actx.createOscillator(), gn = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  gn.gain.setValueAtTime(0.0001, t0);
  gn.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(gn).connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
const sfx = {
  drop(){ tone(520, 0.12, 'sine', 0.12, 260); },
  // 로켓 발사: "슝" (바람 소리) + 위로 미끄러지는 "뿅" + 낮은 "퉁"
  shoot(){
    tone(300, 0.2, 'sine', 0.1, 900); tone(140, 0.14, 'sine', 0.12, 60); tone(1400, 0.08, 'triangle', 0.04, 2000, 0.06);
    if (!actx || !soundOn) return;
    try {
      const t0 = actx.currentTime, dur = 0.32, n = Math.floor(actx.sampleRate*dur);
      const buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random()*2 - 1;
      const src = actx.createBufferSource(); src.buffer = buf;
      const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.4;
      bp.frequency.setValueAtTime(500, t0); bp.frequency.exponentialRampToValueAtTime(2600, t0 + dur);
      const gn = actx.createGain();
      gn.gain.setValueAtTime(0.0001, t0); gn.gain.exponentialRampToValueAtTime(0.16, t0 + 0.05);
      gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(bp).connect(gn).connect(actx.destination); src.start(t0); src.stop(t0 + dur + 0.02);
    } catch(e){}
  },
  land(v, lv = 0){ const f = 260 - lv*16; tone(f, 0.09 + lv*0.008, 'sine', Math.min(0.13, v*0.018), f*0.6); },
  merge(lv){ const f = 330*Math.pow(2, lv/7); tone(f, 0.16, 'triangle', 0.2, f*1.6); tone(f*2, 0.18, 'sine', 0.08, 0, 0.06); },
  mission(){ [523,659,784,1047].forEach((f,i) => tone(f, 0.22, 'triangle', 0.16, 0, i*0.09)); },
  over(){ [392,330,262,196].forEach((f,i) => tone(f, 0.3, 'sine', 0.15, 0, i*0.15)); },
};

let engine, score, best = 0, current, nextLv, aimX, lastDrop, overSince, gameOver;
let effects, rings, labels, mergeQueue, banner, shake, missionIdx, biggest, merges, dropCount = 0;
let flashes = [], screenFlash = 0, seen = new Set();
let aimAng = 0, barrelAng = 0, cannonKick = -1e9;   // 조준 각도(0 = 바로 아래), 그려지는 포신 각도, 마지막 발사 시각
try { best = +localStorage.getItem('planetMergeBest') || 0; } catch(e){}

const randLv = () => Math.floor(Math.random() * (MAX_START + 1));
// 크기에 따른 물리 성질: 작을수록 가볍고 통통 튀며 잘 구르고, 클수록 묵직하게 덜 튐
function physicsFor(lv){
  const t = lv / (PLANETS.length - 1);       // 0(운석) ~ 1(태양)
  return {
    restitution:   0.5 - 0.32*t,             // 튕김: 0.5 → 0.18
    friction:      0.4 + 0.15*t,             // 마찰: 높을수록 부딪히면 잘 굴러감
    frictionStatic:0.5 + 0.3*t,
    frictionAir:   0.008 + 0.006*t,          // 공기 저항: 튕긴 뒤 빨리 잦아듦
    density:       0.0011 + 0.0006*t,        // 클수록 더 묵직
    spinDamp:      0.999 - 0.004*t,          // 회전 감속 (크면 빨리 멈춤)
    spinKick:      0.9 - 0.5*t,              // 부딪힐 때 돌기 시작하는 정도
    squish:        1 - 0.4*t,                // 출렁임 정도
  };
}
function makePlanet(lv, x, y){
  const ph = physicsFor(lv);
  const b = Bodies.circle(x, y, PLANETS[lv].r, {
    restitution: ph.restitution, friction: ph.friction, frictionStatic: ph.frictionStatic,
    frictionAir: ph.frictionAir, density: ph.density, slop: 0.03,
  });
  b.lv = lv; b.ph = ph; b.born = performance.now(); b.seed = Math.random()*4000; b.dropAt = dropCount;
  b.happyUntil = 0; b.squashAt = -1e9; b.squashAmt = 0; b.squashRot = 0;
  Body.setAngularVelocity(b, rnd(-0.04, 0.04));   // 살짝 돌면서 떨어짐
  return b;
}

function start(){
  engine = Engine.create();
  engine.gravity.y = 0.85;
  engine.positionIterations = 10;
  engine.velocityIterations = 8;
  const opt = { isStatic:true, friction:0.3, restitution:0 };
  Composite.add(engine.world, [
    Bodies.rectangle(W/2, H, W*2, WALL*2, opt),
    Bodies.rectangle(0, H/2, WALL*2, H*2, opt),
    Bodies.rectangle(W, H/2, WALL*2, H*2, opt),
  ]);
  Events.on(engine, 'collisionStart', onImpact);
  Events.on(engine, 'collisionStart', onHit);
  Events.on(engine, 'collisionActive', onHit);
  score = 0; current = randLv(); nextLv = randLv();
  aimX = W/2; aimAng = 0; barrelAng = 0; cannonKick = -1e9; lastDrop = 0; overSince = 0; gameOver = false;
  effects = []; rings = []; labels = []; mergeQueue = []; banner = null; shake = 0;
  missionIdx = 0; biggest = 0; merges = 0; dropCount = 0;
  flashes = []; screenFlash = 0;
  seen = new Set(Array.from({length: MAX_START + 1}, (_, i) => i));   // 떨어뜨리는 행성은 이미 본 것
  updateHud(); updateMission();
  $over.hidden = true;
}

// ===== 충돌: 착지 출렁임 =====
function onImpact(ev){
  const now = performance.now();
  for (const p of ev.pairs){
    const n = p.collision.normal;
    const rot = Math.atan2(n.y, n.x);           // 부딪힌 방향으로 찌그러짐
    const other = (b) => b === p.bodyA ? p.bodyB : p.bodyA;
    for (const b of [p.bodyA, p.bodyB]){
      if (b.lv === undefined || now - b.squashAt < 140) continue;
      const o = other(b);
      const rel = Math.hypot(b.velocity.x - (o.velocity?.x || 0), b.velocity.y - (o.velocity?.y || 0));
      if (rel > 1.6){
        b.squashAt = now; b.squashRot = rot;
        b.squashAmt = Math.min(0.34, rel*0.045) * b.ph.squish;
        // 스치듯 부딪히면 그 방향으로 돌기 시작
        const tx = -n.y, ty = n.x;
        const vt = (b.velocity.x - (o.velocity?.x || 0))*tx + (b.velocity.y - (o.velocity?.y || 0))*ty;
        const sign = b === p.bodyA ? 1 : -1;
        const kick = Math.max(-0.15, Math.min(0.15, sign * vt / PLANETS[b.lv].r * b.ph.spinKick));
        Body.setAngularVelocity(b, b.angularVelocity + kick);
        if (rel > 3.5 && b === (b.lv >= (o.lv ?? -1) ? b : o)) sfx.land(rel, b.lv);
      }
    }
  }
}

// ===== 합치기 =====
function onHit(ev){
  for (const p of ev.pairs){
    const a = p.bodyA, b = p.bodyB;
    if (a.lv === undefined || a.lv !== b.lv || a.used || b.used) continue;
    a.used = b.used = true;
    mergeQueue.push([a,b]);
  }
}
function doMerges(now){
  for (const [a,b] of mergeQueue){
    const lv = a.lv;
    const x = (a.position.x + b.position.x)/2, y = (a.position.y + b.position.y)/2;
    Composite.remove(engine.world, [a,b]);
    merges++;
    if (lv < PLANETS.length - 1){
      const n = makePlanet(lv + 1, x, y);
      n.happyUntil = now + 900;
      Composite.add(engine.world, n);
      score += (lv + 1) * (lv + 2);
      biggest = Math.max(biggest, lv + 1);
      const isNew = !seen.has(lv + 1);
      seen.add(lv + 1);
      burst(x, y, PLANETS[lv+1].c, PLANETS[lv+1].r, isNew);
      shockwave(x, y, PLANETS[lv+1].r, n);
      if (isNew){
        // 이번 판에서 처음 만든 행성: 크게 축하!
        labels.push({ text: `NEW! ${PLANETS[lv+1].name} 탄생!`, x: Math.max(90, Math.min(W - 90, x)), y: y - PLANETS[lv+1].r - 10, life: 1.6, big: true });
        screenFlash = 1;
        shake = Math.max(shake, 5 + lv*0.4);
        for (let i = 0; i < 26; i++){
          effects.push({ x: rnd(30, W - 30), y: rnd(-30, 0), vx: rnd(-1, 1), vy: rnd(1.5, 3.5), life: 1.8,
            color: ['#ffd84d','#ff9cc8','#9de9eb','#ffffff', PLANETS[lv+1].c][i % 5], size: rnd(5, 8), star: true });
        }
        sfx.mission();
      } else {
        labels.push({ text: PLANETS[lv+1].name, x, y: y - PLANETS[lv+1].r - 4, life: 1 });
      }
      checkMission(lv + 1);
    } else {
      score += 300;
      labels.push({ text: '초신성 폭발! +300', x, y, life: 1.4 });
      burst(x, y, '#ffffff', 98); burst(x, y, '#ffd84d', 98);
    }
    if (lv >= 5) shake = Math.min(9, 2 + lv*0.7);
    sfx.merge(lv);
    try { navigator.vibrate && navigator.vibrate(lv >= 5 ? 40 : 15); } catch(e){}
  }
  if (mergeQueue.length){
    updateHud();
    $score.classList.add('bump'); setTimeout(() => $score.classList.remove('bump'), 120);
  }
  mergeQueue = [];
}

function burst(x, y, color, r, big = false){
  const k = big ? 1.6 : 1;
  // 번찍이는 빛 + 두 겹으로 퍼지는 고리
  flashes.push({ x, y, r: r*1.6*k, life: 1 });
  rings.push({ x, y, r: r*0.8, max: r*(2.2*k), life: 1, color, w: 6 });
  rings.push({ x, y, r: r*0.5, max: r*(1.5*k), life: 1.25, color: '#ffffff', w: 3 });
  // 사방으로 튀는 빛줄기
  const rays = big ? 14 : 8;
  for (let i = 0; i < rays; i++){
    const ang = i/rays*PI2 + Math.random()*0.3;
    effects.push({ x, y, vx: Math.cos(ang)*(5 + r*0.04)*k, vy: Math.sin(ang)*(5 + r*0.04)*k, life: 0.7, color: '#fff2a8', size: 2.5, ray: true, ang });
  }
  // 반짝이 조각 (크면 더 많이)
  const n = Math.round((14 + r*0.25) * k);
  for (let i = 0; i < n; i++){
    const ang = Math.random()*PI2, sp = (2 + Math.random()*4)*k;
    effects.push({ x: x + Math.cos(ang)*r*0.5, y: y + Math.sin(ang)*r*0.5, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp - 1, life:1.1,
      color: Math.random()<0.35 ? '#ffffff' : (Math.random()<0.5 ? color : '#ff9cc8'), size: 3.5 + r*0.07, star: Math.random() < 0.6 });
  }
}

// 합쳐질 때 주변 행성을 톡 밀어내는 충격파
function shockwave(x, y, r, self){
  const R = r*2.6, power = 2.5 + r*0.04;
  for (const b of Composite.allBodies(engine.world)){
    if (b.lv === undefined || b === self || b.used) continue;
    const dx = b.position.x - x, dy = b.position.y - y, dist = Math.hypot(dx, dy);
    if (dist === 0 || dist > R) continue;
    const f = power * (1 - dist/R) * (1.4 - b.ph.density*400);
    Body.setVelocity(b, { x: b.velocity.x + dx/dist*f, y: b.velocity.y + dy/dist*f - f*0.3 });
    b.squashAt = performance.now(); b.squashRot = Math.atan2(dy, dx); b.squashAmt = 0.22 * b.ph.squish;
  }
}

// ===== 조작 =====
function toWorldX(clientX){ const rect = cv.getBoundingClientRect(); return (clientX - rect.left) / scale; }
function clampX(x, lv){ const r = PLANETS[lv].r; return Math.max(WALL + r, Math.min(W - WALL - r, x)); }
let pressing = false;
// 손가락 위치 → 대포 조준 각도 (0 = 바로 아래, 오른쪽이 +)
function aimAt(e){
  const rect = cv.getBoundingClientRect();
  const wx = (e.clientX - rect.left) / scale, wy = (e.clientY - rect.top) / scale;
  const dx = wx - CANNON_X, dy = Math.max(1, wy - CANNON_Y);   // 대포보다 위를 눌러도 아래쪽으로
  aimAng = Math.max(-AIM_MAX, Math.min(AIM_MAX, Math.atan2(dx, dy)));
}
cv.addEventListener('pointerdown', e => { audioUnlock(); pressing = true; aimAt(e); });
cv.addEventListener('pointermove', e => { if (pressing || e.pointerType === 'mouse') aimAt(e); });
cv.addEventListener('pointerup', e => { if (!pressing) return; pressing = false; aimAt(e); drop(); });
cv.addEventListener('pointercancel', () => { pressing = false; });

// 로켓이 살짝 둥실둥실 (그리기·발사·궤적 모두 같은 값을 씀)
function rocketBob(now){ return Math.sin(now/520)*1.5; }
// 로켓 코끝 바로 앞에서 행성이 나오는 자리 (코끝에 딱 붙게, 벽 안쪽으로)
function muzzlePos(lv, ang, now = performance.now()){
  const r = PLANETS[lv].r, d = ROCKET_NOSE + r + 1;
  return { x: clampX(CANNON_X + Math.sin(ang)*d, lv), y: CANNON_Y + rocketBob(now) + Math.cos(ang)*d };
}

function drop(){
  if (gameOver || paused) return;
  const now = performance.now();
  if (now - lastDrop < DROP_COOLDOWN) return;
  lastDrop = now;
  dropCount++;
  const ang = aimAng, dirX = Math.sin(ang), dirY = Math.cos(ang);
  const m = muzzlePos(current, ang, now);
  const b = makePlanet(current, m.x, m.y);
  Body.setVelocity(b, { x: dirX*SHOOT_SPEED, y: dirY*SHOOT_SPEED });
  Composite.add(engine.world, b);
  // 손맛: 로켓이 뒤로 밀리고 꼬리 불꽃 펑! + 꼬리 연기, 코끝 반짝이
  cannonKick = now;
  const cy = CANNON_Y + rocketBob(now);
  const tx = CANNON_X - dirX*(ROCKET_TAIL + 8), ty = cy - dirY*(ROCKET_TAIL + 8);   // 꼬리 불꽃
  for (let i = 0; i < 12; i++){
    const a = ang + Math.PI + rnd(-0.8, 0.8), sp = rnd(0.8, 2.4);
    effects.push({ x: tx, y: ty, vx: Math.sin(a)*sp, vy: Math.cos(a)*sp - 0.3, life: rnd(0.6, 0.9),
      color: ['#ffffff','#e6e2ff','#ffd6e2'][i % 3], size: rnd(8, 13) });
  }
  const nx = CANNON_X + dirX*ROCKET_NOSE, ny = cy + dirY*ROCKET_NOSE;            // 코끝
  for (let i = 0; i < 6; i++){
    const a = ang + rnd(-1.3, 1.3), sp = rnd(1.5, 3.5);
    effects.push({ x: nx, y: ny, vx: Math.sin(a)*sp, vy: Math.cos(a)*sp, life: 0.8,
      color: ['#ffd84d','#ff9cc8','#9de9eb'][i % 3], size: rnd(5, 7), star: true });
  }
  current = nextLv; nextLv = randLv();
  sfx.shoot();
  try { navigator.vibrate && navigator.vibrate(12); } catch(e){}
  updateHud();
}

// 발사 궤적 미리보기: Matter 계산과 똑같이 (1000/120ms 단계, 중력 0.85, 공기 저항)
function predictPath(lv, ang){
  const r = PLANETS[lv].r, ph = physicsFor(lv);
  const m = muzzlePos(lv, ang);
  let x = m.x, y = m.y;
  let vx = Math.sin(ang)*SHOOT_SPEED*0.5, vy = Math.cos(ang)*SHOOT_SPEED*0.5;   // 한 단계(8.3ms)당 이동량
  const g = engine.gravity.y * 0.001 * (1000/120)*(1000/120), air = 1 - ph.frictionAir*0.5;
  const pts = [];
  for (let step = 1; step <= 60 && pts.length < 11; step++){
    vx *= air; vy = vy*air + g;
    x += vx; y += vy;
    let hit = false;
    if (x < WALL + r){ x = WALL + r; hit = true; }
    if (x > W - WALL - r){ x = W - WALL - r; hit = true; }
    if (y > H - WALL - r){ y = H - WALL - r; hit = true; }
    if (step % 5 === 0 || hit) pts.push([x, y]);
    if (hit) break;
  }
  return pts;
}

// 옛날 폰 브라우저에도 되는 둥근 사각형
function rrect(g, x, y, w, h, r){
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
// 귀여운 로켓 (시작 화면 로켓과 같은 색). 그리는 좌표계는 코끝이 +y(아래)인 상태
function drawCannon(now){
  const t = (now - cannonKick)/1000;
  const recoil = t < 1 ? 10*Math.exp(-t*12) : 0;                  // 뒤로 밀림
  const k = t < 1 ? 0.16*Math.exp(-t*7)*Math.cos(t*30) : 0;       // 몸통 출렁
  const wob = t < 1 ? 0.14*Math.exp(-t*6)*Math.sin(t*26) : 0;     // 살짝 흔들
  const flare = 1 + (t < 1 ? 1.8*Math.exp(-t*6) : 0);             // 발사 때 불꽃 크게
  barrelAng += (aimAng - barrelAng)*0.4;
  ctx.save();
  ctx.translate(CANNON_X, CANNON_Y + rocketBob(now));
  ctx.rotate(-barrelAng + wob);
  ctx.translate(0, -recoil);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // 꼬리 불꽃 (하늘하늘)
  const f = (1 + Math.sin(now/45)*0.18 + Math.sin(now/23)*0.08)*flare;
  const T = -ROCKET_TAIL + 2;
  ctx.fillStyle = 'rgba(255,156,200,.55)';
  ctx.beginPath(); ctx.moveTo(-12, T); ctx.quadraticCurveTo(-14, T - 14*f, 0, T - 24*f); ctx.quadraticCurveTo(14, T - 14*f, 12, T); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffb648';
  ctx.beginPath(); ctx.moveTo(-9, T); ctx.quadraticCurveTo(-10, T - 11*f, 0, T - 19*f); ctx.quadraticCurveTo(10, T - 11*f, 9, T); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff2a8';
  ctx.beginPath(); ctx.moveTo(-5, T); ctx.quadraticCurveTo(-5.5, T - 7*f, 0, T - 11*f); ctx.quadraticCurveTo(5.5, T - 7*f, 5, T); ctx.closePath(); ctx.fill();
  ctx.scale(1 + k, 1 - k);
  // 날개 (분홍, 꼬리 양옆)
  ctx.fillStyle = '#ff6b8b'; ctx.strokeStyle = '#c9c2ff'; ctx.lineWidth = 2.5;
  for (const sx of [-1, 1]){
    ctx.beginPath(); ctx.moveTo(sx*15, 0); ctx.quadraticCurveTo(sx*30, -6, sx*28, -26);
    ctx.lineTo(sx*12, -18); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  // 몸통 (하얗고 통통)
  const body = () => {
    ctx.beginPath(); ctx.moveTo(-15, -ROCKET_TAIL);
    ctx.quadraticCurveTo(0, -ROCKET_TAIL - 4, 15, -ROCKET_TAIL);
    ctx.quadraticCurveTo(20, -8, 18, 6);
    ctx.quadraticCurveTo(15, 26, 0, ROCKET_NOSE);
    ctx.quadraticCurveTo(-15, 26, -18, 6);
    ctx.quadraticCurveTo(-20, -8, -15, -ROCKET_TAIL);
    ctx.closePath();
  };
  const bg = ctx.createLinearGradient(-18, 0, 18, 0);
  bg.addColorStop(0, '#ffffff'); bg.addColorStop(0.7, '#ffffff'); bg.addColorStop(1, '#e6e2ff');
  body(); ctx.fillStyle = bg; ctx.fill();
  // 코 (분홍) + 꼬리 띠
  ctx.save(); body(); ctx.clip();
  ctx.fillStyle = '#ff6b8b'; ctx.fillRect(-25, 17, 50, 30);
  ctx.fillStyle = '#ffc2d0'; ctx.fillRect(-25, 14, 50, 3);
  ctx.fillStyle = '#ffd6e2'; ctx.fillRect(-25, -ROCKET_TAIL - 6, 50, 9);
  ctx.restore();
  body(); ctx.strokeStyle = '#c9c2ff'; ctx.lineWidth = 3; ctx.stroke();
  // 몸통 반짝 하이라이트
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.beginPath(); ctx.ellipse(-12, -2, 2.2, 6, 0.1, 0, PI2); ctx.fill();
  // 동그란 창문 + 얼굴
  const wy = -3, wr = 12.5;
  ctx.fillStyle = '#7cc8ff'; ctx.beginPath(); ctx.arc(0, wy, wr, 0, PI2); ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = '#c9c2ff'; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.ellipse(-5, wy - 7, 4, 2, -0.4, 0, PI2); ctx.fill();
  let mood = 'normal';
  if (t < 0.6) mood = 'happy';
  else if (overSince) mood = 'scared';
  ctx.save(); ctx.translate(0, wy + 1);
  drawFace(ctx, wr*1.25, mood, mood === 'normal' && (now % 2900) < 130, now);
  ctx.restore();
  ctx.restore();
}

function checkOver(now){
  let danger = false;
  for (const b of Composite.allBodies(engine.world)){
    if (b.lv === undefined || now - b.born < 1000) continue;
    if (b.position.y - PLANETS[b.lv].r < DANGER_Y){ danger = true; break; }
  }
  if (!danger){ overSince = 0; return false; }
  if (!overSince) overSince = now;
  return now - overSince > OVER_TIME;
}

// ===== 그리기 =====
function draw(now){
  ctx.save();
  if (shake > 0.2) ctx.translate(rnd(-shake, shake), rnd(-shake, shake));
  if (bgCanvas) ctx.drawImage(bgCanvas, 0, 0, W, H);
  for (const s of stars){
    ctx.globalAlpha = 0.35 + 0.65*Math.max(0, Math.sin(now/700 + s.t));
    (s.spark ? drawSparkle : drawStar5)(ctx, s.x, s.y, s.s, s.pink ? '#ffb3d6' : '#ffffff');
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(201,194,255,.3)';
  ctx.fillRect(0,0,WALL,H); ctx.fillRect(W-WALL,0,WALL,H); ctx.fillRect(0,H-WALL,W,WALL);

  // 위험선
  const warn = overSince && Math.floor(now/150)%2 === 0;
  ctx.setLineDash([10,8]); ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.strokeStyle = warn ? '#ff6b8b' : 'rgba(255,156,200,.35)';
  ctx.beginPath(); ctx.moveTo(WALL+6, DANGER_Y); ctx.lineTo(W-WALL-6, DANGER_Y); ctx.stroke();
  ctx.setLineDash([]);

  // 행성들
  for (const b of Composite.allBodies(engine.world)){
    if (b.lv === undefined) continue;
    const r = PLANETS[b.lv].r;
    const t = Math.min(1, (now - b.born)/220);
    const pop = 0.55 + 0.45*t + Math.sin(t*Math.PI)*0.15;
    const st = (now - b.squashAt)/1000;
    const k = b.squashAmt * Math.exp(-st*6) * Math.cos(st*28);   // 더 크고 오래 출렁
    const waited = dropCount - b.dropAt;
    let mood = 'normal';
    if (now < b.happyUntil) mood = 'happy';
    else if (b.position.y - r < DANGER_Y + 30) mood = 'scared';
    else if (waited >= CRY_AFTER) mood = 'cry';
    else if (waited >= SAD_AFTER) mood = 'sad';
    drawPlanet(ctx, b.lv, b.position.x, b.position.y, r*pop, {
      angle: b.angle, sx: 1 - k, sy: 1 + k, squashRot: b.squashRot, mood, now,
      blink: mood !== 'cry' && ((now + b.seed) % 3600) < 130,
    });
  }

  // 대포 + 발사 궤적 점선 + 포구에 들어 있는 행성
  if (!gameOver){
    const ready = now - lastDrop >= DROP_COOLDOWN;
    if (ready){
      const pts = predictPath(current, aimAng);
      pts.forEach(([px, py], i) => {
        ctx.globalAlpha = 0.9 * (1 - 0.7*i/pts.length);
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(px, py, 4.2 - i*0.2, 0, PI2); ctx.fill();
      });
      ctx.globalAlpha = 1;
    }
    const m = muzzlePos(current, barrelAng, now);
    const pop = Math.min(1, (now - lastDrop)/DROP_COOLDOWN);   // 발사 뒤 새 행성이 포구에서 쏙 나옴
    drawPlanet(ctx, current, m.x, m.y, PLANETS[current].r*(0.6 + 0.4*pop), { alpha: ready ? 1 : 0.4, blink: (now % 3200) < 130 });
  }
  drawCannon(now);

  // 처음 한 번도 안 쐈으면 조작 안내 (대포 아래에서 좌우로 끌기)
  if (introDone && dropCount === 0 && !gameOver){
    const hx = W/2 + Math.sin(now/600)*110, hy = 215;
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    ctx.beginPath(); ctx.arc(hx, hy, 26 + Math.sin(now/200)*3, 0, PI2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath(); ctx.arc(hx, hy, 12, 0, PI2); ctx.fill();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.font = '24px "Jua","Apple SD Gothic Neo",sans-serif';
    ctx.lineWidth = 7; ctx.strokeStyle = '#1b2350';
    ctx.strokeText('꾹 눌러서 로켓을 겨누고', W/2, H*0.5); ctx.fillStyle = '#fff'; ctx.fillText('꾹 눌러서 로켓을 겨누고', W/2, H*0.5);
    ctx.strokeText('손을 떼면 발사!', W/2, H*0.5 + 34); ctx.fillStyle = '#ffd84d'; ctx.fillText('손을 떼면 발사!', W/2, H*0.5 + 34);
  }

  // 번찍이는 빛
  ctx.globalCompositeOperation = 'lighter';
  for (const f of flashes){
    const gr = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
    gr.addColorStop(0, `rgba(255,250,220,${0.75*f.life})`);
    gr.addColorStop(0.4, `rgba(255,200,230,${0.35*f.life})`);
    gr.addColorStop(1, 'rgba(255,200,230,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, PI2); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  // 퍼지는 고리
  for (const rg of rings){
    ctx.globalAlpha = Math.max(0, Math.min(1, rg.life));
    ctx.strokeStyle = rg.color; ctx.lineWidth = (rg.w || 4)*Math.min(1, rg.life);
    ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r, 0, PI2); ctx.stroke();
  }
  // 파티클
  for (const p of effects){
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
    if (p.ray){
      ctx.strokeStyle = p.color; ctx.lineWidth = p.size; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - Math.cos(p.ang)*14*p.life, p.y - Math.sin(p.ang)*14*p.life); ctx.stroke();
    }
    else if (p.star) drawSparkle(ctx, p.x, p.y, p.size*0.6*Math.min(1,p.life), p.color);
    else { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size*0.5*Math.min(1,p.life), 0, PI2); ctx.fill(); }
  }
  // 이름 글자
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.font = '22px "Jua","Apple SD Gothic Neo",sans-serif';
  for (const l of labels){
    ctx.globalAlpha = Math.min(1, l.life);
    ctx.save(); ctx.translate(l.x, l.y);
    if (l.big){
      const age = 1.6 - l.life, s = age < 0.25 ? 0.5 + age/0.25*0.7 : 1.2 - Math.min(0.2, (age-0.25)*0.6);
      ctx.scale(s, s);
      ctx.font = '30px "Jua","Apple SD Gothic Neo",sans-serif';
      ctx.lineWidth = 8; ctx.strokeStyle = '#1b2350'; ctx.strokeText(l.text, 0, 0);
      ctx.fillStyle = '#ffd84d'; ctx.fillText(l.text, 0, 0);
    } else {
      ctx.font = '22px "Jua","Apple SD Gothic Neo",sans-serif';
      ctx.lineWidth = 6; ctx.strokeStyle = '#1b2350'; ctx.strokeText(l.text, 0, 0);
      ctx.fillStyle = '#ffffff'; ctx.fillText(l.text, 0, 0);
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // 미션 성공 배너
  if (banner){
    const t = (now - banner.t0)/1000;
    if (t > 2.2) banner = null;
    else {
      const s = t < 0.35 ? 0.4 + 0.6*Math.sin(t/0.35*Math.PI/2)*1.12 : 1;
      ctx.globalAlpha = t > 1.8 ? 1 - (t-1.8)/0.4 : 1;
      ctx.save(); ctx.translate(W/2, H*0.38); ctx.scale(s, s);
      ctx.font = '44px "Jua","Apple SD Gothic Neo",sans-serif';
      ctx.lineWidth = 10; ctx.strokeStyle = '#1b2350'; ctx.strokeText(banner.text, 0, 0);
      ctx.fillStyle = '#ffd84d'; ctx.fillText(banner.text, 0, 0);
      ctx.font = '22px "Jua","Apple SD Gothic Neo",sans-serif';
      ctx.lineWidth = 6; ctx.strokeText(banner.sub, 0, 42);
      ctx.fillStyle = '#ff9cc8'; ctx.fillText(banner.sub, 0, 42);
      ctx.restore(); ctx.globalAlpha = 1;
    }
  }
  ctx.restore();
}

// ===== 메인 루프 =====
function loop(now){
  if (!gameOver && !paused){
    // 두 번에 나눠 계산하면 빠른 충돌도 부드럽고 겹침이 적음
    Engine.update(engine, 1000/120);
    Engine.update(engine, 1000/120);
    for (const b of Composite.allBodies(engine.world)){
      if (b.lv === undefined) continue;
      // 바닥이나 다른 행성 위에서 옆으로 움직이면 미끄러지지 않고 굴러가게
      let av = b.angularVelocity * b.ph.spinDamp;
      if (Math.abs(b.velocity.y) < 1.2 && Math.abs(b.velocity.x) > 0.35){
        const target = b.velocity.x / PLANETS[b.lv].r;
        av += (target - av) * 0.12;
      }
      if (b.speed < 0.08 && Math.abs(av) < 0.01) av = 0;   // 멈춘 행성은 떨림 없이 멈추기
      av = Math.max(-0.3, Math.min(0.3, av));             // 너무 빠른 회전 방지
      Body.setAngularVelocity(b, av);
      // 너무 빨라지지 않게 속도 상한
      const sp = b.speed, MAXV = 9;
      if (sp > MAXV) Body.setVelocity(b, { x: b.velocity.x * MAXV/sp, y: b.velocity.y * MAXV/sp });
    }
    doMerges(now);
    if (checkOver(now)) endGame();
  }
  for (const p of effects){ p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.vx *= 0.98; p.life -= 0.025; }
  effects = effects.filter(p => p.life > 0);
  for (const rg of rings){ rg.r += (rg.max - rg.r)*0.15; rg.life -= 0.05; }
  rings = rings.filter(rg => rg.life > 0);
  for (const l of labels){ l.y -= 0.6; l.life -= 0.02; }
  labels = labels.filter(l => l.life > 0);
  shake *= 0.85;
  for (const f of flashes) f.life -= 0.07;
  flashes = flashes.filter(f => f.life > 0);
  screenFlash *= 0.88;
  draw(now);
  if (screenFlash > 0.02){
    ctx.fillStyle = `rgba(255,248,225,${screenFlash*0.4})`; ctx.fillRect(0, 0, W, H);
  }
  requestAnimationFrame(loop);
}

    [[0.2,0.18,0.45,'255,150,200',.13],[0.85,0.5,0.4,'170,160,255',.13],[0.3,0.92,0.45,'255,170,210',.11]].forEach(([x,y,r,c,a]) => {
      const gr = s.createRadialGradient(BW*x,BH*y,0,BW*x,BH*y,M*r);
      gr.addColorStop(0, `rgba(${c},${a})`); gr.addColorStop(1, `rgba(${c},0)`);
      s.fillStyle = gr; s.fillRect(0,0,BW,BH);
    });
    s.lineWidth = 1.2; s.strokeStyle = 'rgba(220,215,255,.28)'; s.setLineDash([3,4]);
    for (const line of CONST){
      s.beginPath();
      line.forEach(([x,y], i) => i ? s.lineTo(BW*x, BH*y) : s.moveTo(BW*x, BH*y));
      s.stroke();
    }
    s.setLineDash([]);
    const n = Math.round(BW*BH/2600);
    bgStars = Array.from({length:n}, () => ({
      x: Math.random()*BW, y: Math.random()*BH, s: rnd(0.6, 1.8), t: Math.random()*6, sp: rnd(0.6, 1.6),
      kind: Math.random() < 0.12 ? (Math.random() < 0.5 ? 'spark' : 'star') : 'dot',
      pink: Math.random() < 0.4,
    }));
  }
  sizeBg();
  addEventListener('resize', sizeBg);

  function spawnMeteor(){
    const ang = rnd(0.55, 0.85);                  // 오른쪽 위 → 왼쪽 아래
    const sp = rnd(420, 650);
    meteors.push({
      x: rnd(BW*0.3, BW*1.1), y: rnd(-40, BH*0.35),
      vx: -Math.cos(ang)*sp, vy: Math.sin(ang)*sp,
      len: rnd(70, 140), life: 1, w: rnd(1.5, 2.8),
      color: Math.random() < 0.35 ? '255,179,214' : '255,246,210',
    });
  }

  // 밑에서 데굴데굴 굴러가는 행성 행렬 (운석 → 태양 순서)
  let paradeX = 0;
  const tipEl = el.querySelector('.tip');
  const titleEl = el.querySelector('h1');

  // 둥실둥실 떠다니는 우주비행사
  function drawAstronaut(x, y, s, now){
    bg.save(); bg.translate(x, y); bg.scale(s, s); bg.rotate(Math.sin(now/1300)*0.25);
    const line = '#4b4f8a';
    bg.lineWidth = 2.2; bg.strokeStyle = line; bg.lineJoin = 'round'; bg.lineCap = 'round';
    // 배낭
    bg.fillStyle = '#c9c2ff'; roundRect(-16, -2, 32, 30, 8); bg.fill(); bg.stroke();
    // 다리
    bg.fillStyle = '#ffffff';
    roundRect(-13, 22, 11, 16, 5); bg.fill(); bg.stroke();
    roundRect(2, 22, 11, 16, 5); bg.fill(); bg.stroke();
    // 몸
    roundRect(-14, 0, 28, 28, 10); bg.fill(); bg.stroke();
    bg.fillStyle = '#ff9cc8'; bg.beginPath(); bg.arc(0, 12, 4, 0, PI2); bg.fill();
    // 왼팔 (가만히), 오른팔 (손 흔들기)
    bg.fillStyle = '#ffffff';
    bg.save(); bg.translate(-13, 6); bg.rotate(0.5); roundRect(-5, 0, 10, 18, 5); bg.fill(); bg.stroke(); bg.restore();
    bg.save(); bg.translate(13, 5); bg.rotate(-2.4 + Math.sin(now/180)*0.45); roundRect(-5, 0, 10, 18, 5); bg.fill(); bg.stroke(); bg.restore();
    // 헬멧
    bg.fillStyle = '#ffffff'; bg.beginPath(); bg.arc(0, -14, 18, 0, PI2); bg.fill(); bg.stroke();
    bg.fillStyle = '#2a3366'; bg.beginPath(); bg.ellipse(0, -13, 13, 10.5, 0, 0, PI2); bg.fill();
    // 헬멧 안 귀여운 눈
    const blink = (now % 3300) < 130;
    bg.fillStyle = '#ffffff';
    if (blink){ bg.strokeStyle = '#fff'; bg.lineWidth = 1.6; bg.beginPath(); bg.moveTo(-7,-13); bg.lineTo(-3,-13); bg.moveTo(3,-13); bg.lineTo(7,-13); bg.stroke(); }
    else { bg.beginPath(); bg.arc(-5, -13, 2.4, 0, PI2); bg.arc(5, -13, 2.4, 0, PI2); bg.fill(); }
    bg.fillStyle = 'rgba(255,156,200,.7)'; bg.beginPath(); bg.ellipse(-8.5, -8.5, 2.6, 1.6, 0, 0, PI2); bg.ellipse(8.5, -8.5, 2.6, 1.6, 0, 0, PI2); bg.fill();
    bg.fillStyle = 'rgba(255,255,255,.55)'; bg.beginPath(); bg.ellipse(-6, -19, 4, 2, -0.5, 0, PI2); bg.fill();
    // 안테나
    bg.strokeStyle = line; bg.lineWidth = 2; bg.beginPath(); bg.moveTo(10, -29); bg.lineTo(14, -38); bg.stroke();
    bg.fillStyle = (now % 1000) < 500 ? '#ffd84d' : '#ff9cc8'; bg.beginPath(); bg.arc(14, -39, 3, 0, PI2); bg.fill();
    bg.restore();
  }

  // UFO 탄 외계인
  function drawAlien(x, y, s, now){
    bg.save(); bg.translate(x, y); bg.scale(s, s); bg.rotate(Math.sin(now/900)*0.12);
    const line = '#4b4f8a';
    bg.lineWidth = 2.2; bg.strokeStyle = line; bg.lineJoin = 'round'; bg.lineCap = 'round';
    // 빔
    const beam = bg.createLinearGradient(0, 8, 0, 52);
    beam.addColorStop(0, `rgba(255,242,168,${0.35 + Math.sin(now/300)*0.12})`); beam.addColorStop(1, 'rgba(255,242,168,0)');
    bg.fillStyle = beam; bg.beginPath(); bg.moveTo(-10, 8); bg.lineTo(10, 8); bg.lineTo(20, 52); bg.lineTo(-20, 52); bg.closePath(); bg.fill();
    // 외계인 (유리 안)
    bg.fillStyle = '#8fe08a'; bg.beginPath(); bg.ellipse(0, -10, 11, 12, 0, 0, PI2); bg.fill(); bg.stroke();
    // 더듬이
    bg.beginPath(); bg.moveTo(-5, -20); bg.lineTo(-9, -29); bg.moveTo(5, -20); bg.lineTo(9, -29); bg.stroke();
    bg.fillStyle = '#ff9cc8'; bg.beginPath(); bg.arc(-9, -30, 2.6, 0, PI2); bg.arc(9, -30, 2.6, 0, PI2); bg.fill();
    // 큰 눈
    const blink = ((now + 1700) % 3000) < 130;
    if (blink){ bg.beginPath(); bg.moveTo(-7,-11); bg.lineTo(-2,-11); bg.moveTo(2,-11); bg.lineTo(7,-11); bg.stroke(); }
    else {
      bg.fillStyle = '#2b2147'; bg.beginPath(); bg.ellipse(-4.5, -11, 3.4, 4.2, 0, 0, PI2); bg.ellipse(4.5, -11, 3.4, 4.2, 0, 0, PI2); bg.fill();
      bg.fillStyle = '#fff'; bg.beginPath(); bg.arc(-5.5, -12.5, 1.3, 0, PI2); bg.arc(3.5, -12.5, 1.3, 0, PI2); bg.fill();
    }
    bg.strokeStyle = '#2b2147'; bg.lineWidth = 1.5; bg.beginPath(); bg.arc(0, -5.5, 2.5, 0.15*Math.PI, 0.85*Math.PI); bg.stroke();
    // 유리 돔
    bg.strokeStyle = line; bg.lineWidth = 2.2;
    bg.fillStyle = 'rgba(190,230,255,.28)'; bg.beginPath(); bg.arc(0, -4, 17, Math.PI, PI2); bg.closePath(); bg.fill(); bg.stroke();
    bg.fillStyle = 'rgba(255,255,255,.6)'; bg.beginPath(); bg.ellipse(-8, -13, 3, 5, 0.5, 0, PI2); bg.fill();
    // 접시
    bg.fillStyle = '#c9c2ff'; bg.beginPath(); bg.ellipse(0, 2, 30, 9, 0, 0, PI2); bg.fill(); bg.stroke();
    bg.fillStyle = '#9fa6e8'; bg.beginPath(); bg.ellipse(0, 6, 18, 4, 0, 0, PI2); bg.fill();
    // 반짝이는 불빛
    ['#ffd84d','#ff9cc8','#9de9eb','#ffd84d','#ff9cc8'].forEach((c, i) => {
      const on = Math.floor(now/220 + i) % 2 === 0;
      bg.fillStyle = on ? c : 'rgba(255,255,255,.35)';
      bg.beginPath(); bg.arc(-20 + i*10, 2, 2.3, 0, PI2); bg.fill();
    });
    bg.restore();
  }
  function roundRect(x, y, w, h, r){
    bg.beginPath(); bg.moveTo(x + r, y); bg.arcTo(x + w, y, x + w, y + h, r); bg.arcTo(x + w, y + h, x, y + h, r);
    bg.arcTo(x, y + h, x, y, r); bg.arcTo(x, y, x + w, y, r); bg.closePath();
  }

  function drawBg(dt, now){
    bg.clearRect(0,0,BW,BH);
    if (bgStatic) bg.drawImage(bgStatic, 0, 0, BW, BH);
    // 별자리 꼭짓점은 반짝반짝
    CONST.forEach((line, li) => line.forEach(([x,y], i) => {
      bg.globalAlpha = 0.55 + 0.45*Math.sin(now/500 + li*2 + i);
      drawSparkle(bg, BW*x, BH*y, 2.4, li % 2 ? '#ffd1e6' : '#ffffff');
    }));
    bg.globalAlpha = 1;

    // 제목 주위를 도는 작은 행성들
    const er = el.getBoundingClientRect(), tr = titleEl.getBoundingClientRect();
    const ox = tr.left - er.left + tr.width/2, oy = tr.top - er.top + tr.height/2;
    const rx = Math.min(BW/2 - 16, tr.width*0.85), ry = tr.height*0.62;
    bg.save(); bg.translate(ox, oy); bg.rotate(-0.18);
    bg.strokeStyle = 'rgba(255,216,77,.28)'; bg.lineWidth = 1.5; bg.setLineDash([5,6]);
    bg.beginPath(); bg.ellipse(0, 0, rx, ry, 0, 0, PI2); bg.stroke(); bg.setLineDash([]);
    [[1,0,9],[3,PI2/3,10],[6,PI2*2/3,11]].forEach(([lv, off, r]) => {
      const a = now/2600 + off;
      drawPlanet(bg, lv, Math.cos(a)*rx, Math.sin(a)*ry, r, { angle: a*2, blink: ((now + off*1000) % 3400) < 130, now });
    });
    bg.restore();

    // 맨 아래 행성 행렬
    const tb = tipEl.getBoundingClientRect().bottom - er.top;
    const room = BH - tb;
    if (room > 70){
      const y = tb + room*0.55;
      const gap = 16, sizes = PLANETS.map((_, i) => 9 + i*1.5);
      const total = sizes.reduce((a, r) => a + r*2 + gap, 0);
      paradeX = (paradeX + dt*28) % total;
      // 바닥 점선
      bg.strokeStyle = 'rgba(201,194,255,.25)'; bg.lineWidth = 1.5; bg.setLineDash([2,6]);
      bg.beginPath(); bg.moveTo(0, y + 26); bg.lineTo(BW, y + 26); bg.stroke(); bg.setLineDash([]);
      for (let rep = -1; rep <= Math.ceil(BW/total); rep++){
        let x = paradeX + rep*total;
        sizes.forEach((r, i) => {
          const cx = x + r;
          x += r*2 + gap;
          if (cx < -40 || cx > BW + 40) return;
          const hop = Math.abs(Math.sin(now/260 + i*0.7))*4;
          drawPlanet(bg, i, cx, y + 26 - r - hop, r, { angle: cx/r, blink: ((now + i*500) % 3600) < 130, now });
        });
      }
    }

    // 버튼 양옆 빈곳: 왼쪽 우주비행사, 오른쪽 UFO 외계인
    const anchor = (btn.hidden ? load : btn).getBoundingClientRect();
    const ay = anchor.top - er.top + anchor.height/2;
    const leftGap = anchor.left - er.left, rightGap = er.right - anchor.right;
    const sc = Math.max(0.6, Math.min(1.3, Math.min(leftGap, rightGap)/80));
    drawAstronaut(leftGap/2, ay - 6 + Math.sin(now/900)*8, sc, now);
    drawAlien(BW - rightGap/2, ay - 10 + Math.sin(now/800 + 1)*8, sc, now);
    for (const s of bgStars){
      const a = 0.25 + 0.75*Math.max(0, Math.sin(now/1000*s.sp + s.t));
      bg.globalAlpha = a;
      const col = s.pink ? '#ffb3d6' : '#ffffff';
      if (s.kind === 'spark') drawSparkle(bg, s.x, s.y, s.s*1.8, col);
      else if (s.kind === 'star') drawStar5(bg, s.x, s.y, s.s*2.2, col);
      else { bg.fillStyle = col; bg.beginPath(); bg.arc(s.x, s.y, s.s*0.7, 0, PI2); bg.fill(); }
    }
    bg.globalAlpha = 1;

    if (now > nextMeteor){ spawnMeteor(); if (Math.random() < 0.25) spawnMeteor(); nextMeteor = now + rnd(500, 1500); }
    for (const m of meteors){
      m.x += m.vx*dt; m.y += m.vy*dt;
      if (m.y > BH*0.55) m.life -= dt*2.2;
      const sp = Math.hypot(m.vx, m.vy), tx = m.x - m.vx/sp*m.len, ty = m.y - m.vy/sp*m.len;
      const gr = bg.createLinearGradient(m.x, m.y, tx, ty);
      gr.addColorStop(0, `rgba(${m.color},${0.95*Math.max(0, m.life)})`);
      gr.addColorStop(1, `rgba(${m.color},0)`);
      bg.strokeStyle = gr; bg.lineWidth = m.w; bg.lineCap = 'round';
      bg.beginPath(); bg.moveTo(m.x, m.y); bg.lineTo(tx, ty); bg.stroke();
      bg.globalAlpha = Math.max(0, m.life);
      drawSparkle(bg, m.x, m.y, m.w*1.6, '#ffffff');
      bg.globalAlpha = 1;
    }
    meteors = meteors.filter(m => m.life > 0 && m.x > -200 && m.y < BH + 200);
  }

  function hit(b, now, rot){ b.hitAt = now; b.hitRot = rot; b.happyUntil = now + 500; }

  function stepBalls(dt, now){
    for (const b of balls){
      b.x += b.vx*dt; b.y += b.vy*dt; b.ang += b.spin*dt;
      if (b.x < b.r){ b.x = b.r; b.vx = Math.abs(b.vx); b.spin = b.vy/b.r; hit(b, now, 0); }
      if (b.x > CW - b.r){ b.x = CW - b.r; b.vx = -Math.abs(b.vx); b.spin = -b.vy/b.r; hit(b, now, 0); }
      if (b.y < b.r){ b.y = b.r; b.vy = Math.abs(b.vy); b.spin = -b.vx/b.r; hit(b, now, Math.PI/2); }
      if (b.y > CH - b.r){ b.y = CH - b.r; b.vy = -Math.abs(b.vy); b.spin = b.vx/b.r; hit(b, now, Math.PI/2); }
    }
    // 행성끼리 부딪히면 통! 튕겨나감 (큰 행성이 더 묵직)
    for (let i = 0; i < balls.length; i++) for (let j = i + 1; j < balls.length; j++){
      const a = balls[i], b = balls[j];
      const dx = b.x - a.x, dy = b.y - a.y, dist = Math.hypot(dx, dy), min = a.r + b.r;
      if (dist === 0 || dist >= min) continue;
      const nx = dx/dist, ny = dy/dist;
      const ma = a.r*a.r, mb = b.r*b.r;
      const push = (min - dist);
      a.x -= nx*push*mb/(ma+mb); a.y -= ny*push*mb/(ma+mb);
      b.x += nx*push*ma/(ma+mb); b.y += ny*push*ma/(ma+mb);
      const rel = (b.vx - a.vx)*nx + (b.vy - a.vy)*ny;
      if (rel >= 0) continue;
      const imp = -2*rel/(ma + mb);
      a.vx -= imp*mb*nx; a.vy -= imp*mb*ny;
      b.vx += imp*ma*nx; b.vy += imp*ma*ny;
      const tang = (b.vx - a.vx)*(-ny) + (b.vy - a.vy)*nx;
      a.spin -= tang/a.r*0.5; b.spin += tang/b.r*0.5;
      const rot = Math.atan2(ny, nx);
      hit(a, now, rot); hit(b, now, rot);
    }
    // 속도가 너무 느리거나 빨라지지 않게
    for (const b of balls){
      const sp = Math.hypot(b.vx, b.vy), want = Math.max(40, Math.min(90, sp));
      if (sp > 0){ b.vx *= want/sp; b.vy *= want/sp; }
      b.spin *= 0.995;
    }
  }

  // 귀여운 로켓
  function drawRocket(x, y, rot, now){
    g.save(); g.translate(x, y); g.rotate(rot);
    // 불꽃
    const f = 1 + Math.sin(now/40)*0.25;
    g.fillStyle = '#ffb648';
    g.beginPath(); g.moveTo(-14, -6); g.quadraticCurveTo(-14 - 18*f, 0, -14, 6); g.closePath(); g.fill();
    g.fillStyle = '#fff2a8';
    g.beginPath(); g.moveTo(-14, -3.5); g.quadraticCurveTo(-14 - 10*f, 0, -14, 3.5); g.closePath(); g.fill();
    // 날개
    g.fillStyle = '#ff6b8b';
    g.beginPath(); g.moveTo(-8, -8); g.lineTo(-16, -16); g.lineTo(-14, -6); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(-8, 8); g.lineTo(-16, 16); g.lineTo(-14, 6); g.closePath(); g.fill();
    // 몸통
    g.fillStyle = '#ffffff';
    g.beginPath(); g.moveTo(-14, -9); g.lineTo(6, -9); g.quadraticCurveTo(22, -6, 26, 0);
    g.quadraticCurveTo(22, 6, 6, 9); g.lineTo(-14, 9); g.closePath(); g.fill();
    g.strokeStyle = '#c9c2ff'; g.lineWidth = 1.5; g.stroke();
    // 코
    g.fillStyle = '#ff6b8b';
    g.beginPath(); g.moveTo(14, -7.5); g.quadraticCurveTo(22, -6, 26, 0); g.quadraticCurveTo(22, 6, 14, 7.5); g.closePath(); g.fill();
    // 창문
    g.fillStyle = '#7cc8ff'; g.beginPath(); g.arc(2, 0, 4.6, 0, PI2); g.fill();
    g.strokeStyle = '#3f62d8'; g.lineWidth = 1.5; g.stroke();
    g.fillStyle = 'rgba(255,255,255,.8)'; g.beginPath(); g.arc(0.8, -1.6, 1.4, 0, PI2); g.fill();
    g.restore();
  }

  function rocketAt(t){
    // 화면을 크게 한 바퀴 도는 경로 (5초에 한 바퀴)
    const k = (t % 5000) / 5000 * PI2;
    return { x: CW/2 + Math.cos(k)*(CW/2 - 30), y: CH/2 + Math.sin(k*2)*(CH/2 - 34) };
  }

  function frame(now){
    if (!running) return;
    const dt = Math.min(0.05, (now - last)/1000); last = now;
    stepBalls(dt, now);
    drawBg(dt, now);
    g.clearRect(0,0,CW,CH);

    // 로켓 꼬리 반짝이
    const rp = rocketAt(now - t0), rp2 = rocketAt(now - t0 + 30);
    const rot = Math.atan2(rp2.y - rp.y, rp2.x - rp.x);
    trail.push({ x: rp.x - Math.cos(rot)*16, y: rp.y - Math.sin(rot)*16, life: 1 });
    for (const s of trail){ s.life -= dt*1.6; }
    while (trail.length && trail[0].life <= 0) trail.shift();
    for (const s of trail){
      g.globalAlpha = Math.max(0, s.life)*0.8;
      drawSparkle(g, s.x, s.y, 2.2*s.life + 0.5, s.life > 0.5 ? '#fff2a8' : '#ffb3d6');
    }
    g.globalAlpha = 1;

    for (const b of balls){
      const st = (now - b.hitAt)/1000;
      const k = 0.3 * Math.exp(-st*6) * Math.cos(st*28);
      drawPlanet(g, b.lv, b.x, b.y, b.r, {
        angle: b.ang, sx: 1 - k, sy: 1 + k, squashRot: b.hitRot,
        mood: now < b.happyUntil ? 'happy' : 'normal',
        blink: ((now + b.seed) % 3200) < 130, now,
      });
    }
    drawRocket(rp.x, rp.y, rot, now);

    // 로딩 막대
    if (!ready){
      const k = Math.min(1, (now - t0)/1400);
      bar.style.width = (k*100) + '%';
      if (k >= 1 && fontsOk){
        ready = true; load.hidden = true; btn.hidden = false;
        try { btn.focus({ preventScroll: true }); } catch(e){}
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  btn.addEventListener('click', () => {
    audioUnlock();
    sfx.mission();
    start();
    paused = false;
    introDone = true;
    el.classList.add('out');
    setTimeout(() => { el.hidden = true; running = false; }, 460);
  });

  // 나가기 → 처음 화면 다시 보여주기
  window.showIntro = () => {
    introDone = false;
    el.hidden = false;
    requestAnimationFrame(() => el.classList.remove('out'));
    if (!running){ running = true; requestAnimationFrame(frame); }
    try { btn.focus({ preventScroll: true }); } catch(e){}
  };
})();

// ===== 메뉴: 잠깐 멈춤 / 다시 시작 / 나가기 (한 번 더 물어봄) =====
var paused = false;
const $menu = document.getElementById('menu');
const $confirm = document.getElementById('confirm');
let confirmAction = null;

function openMenu(){
  if (gameOver || !introDone) return;
  paused = true;
  document.getElementById('menuScore').textContent = score;
  $menu.hidden = false;
  document.getElementById('resume').focus();
}
function resume(){
  $menu.hidden = true; $confirm.hidden = true;
  overSince = 0;   // 멈춘 동안 게임오버 시간이 쌓이지 않게
  paused = false;
}
function ask(title, msg, yesText, action){
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmMsg').textContent = msg;
  document.getElementById('confirmYes').textContent = yesText;
  confirmAction = action;
  $menu.hidden = true;        // 메뉴는 숨기고 확인 창만 보이게
  $confirm.hidden = false;
  document.getElementById('confirmNo').focus();
}
function doRestart(){
  $menu.hidden = true; $confirm.hidden = true;
  start(); paused = false;
}
function doExit(){
  $menu.hidden = true; $confirm.hidden = true; $over.hidden = true;
  start(); paused = true;
  window.showIntro();
}

document.getElementById('menuBtn').addEventListener('click', openMenu);
document.getElementById('resume').addEventListener('click', resume);
document.getElementById('menuRestart').addEventListener('click', () =>
  ask('정말 다시 시작할까요?', '지금 만든 행성과 점수가 사라져요', '다시 시작', doRestart));
document.getElementById('menuExit').addEventListener('click', () =>
  ask('정말 나갈까요?', '처음 화면으로 돌아가고 지금 게임은 사라져요', '나가기', doExit));
document.getElementById('confirmNo').addEventListener('click', () => { $confirm.hidden = true; $menu.hidden = false; document.getElementById('resume').focus(); });
document.getElementById('confirmYes').addEventListener('click', () => { const a = confirmAction; confirmAction = null; if (a) a(); });
document.getElementById('overExit').addEventListener('click', doExit);
addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$confirm.hidden){ $confirm.hidden = true; $menu.hidden = false; }
  else if (!$menu.hidden) resume();
  else openMenu();
});
// 다른 앱으로 나갔다 오면 자동으로 멈춤
document.addEventListener('visibilitychange', () => { if (document.hidden) openMenu(); });

fit();
start();
requestAnimationFrame(loop);
</script>

</html>
